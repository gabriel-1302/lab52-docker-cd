name: CD - Build, Push and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mi-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/mi-app:v3.0.0
            ${{ secrets.DOCKER_USERNAME }}/mi-app:latest

      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/mi-app:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Desplegar en Staging
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKER_USERNAME }}/mi-app:latest"

            echo "=== Desplegando en STAGING ==="

            docker pull $IMAGE

            docker run -d \
              --name mi-app-staging-new \
              --restart unless-stopped \
              -p 3001:3000 \
              $IMAGE

            sleep 5

            if curl -sf http://localhost:3001/health; then
              echo ""
              echo "Health check exitoso en staging."

              docker stop mi-app-staging || true
              docker rm mi-app-staging || true

              docker run -d \
                --name mi-app-staging \
                --restart unless-stopped \
                -p 3001:3000 \
                $IMAGE

              docker rm -f mi-app-staging-new || true
              echo "Staging actualizado correctamente."
            else
              echo ""
              echo "Health check FALLIDO en staging."
              docker rm -f mi-app-staging-new || true
              exit 1
            fi

            docker system prune -f

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Desplegar en Production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKER_USERNAME }}/mi-app:${{ github.sha }}"

            echo "=== Desplegando en PRODUCTION ==="

            docker pull $IMAGE

            docker run -d \
              --name mi-app-new \
              --restart unless-stopped \
              -p 8080:3000 \
              $IMAGE

            sleep 5

            if curl -sf http://localhost:8080/health; then
              echo ""
              echo "Health check exitoso. Activando en produccion..."

              docker stop mi-app || true
              docker rm mi-app || true

              docker run -d \
                --name mi-app \
                --restart unless-stopped \
                -p 80:3000 \
                $IMAGE

              docker rm -f mi-app-new || true
              echo "Produccion actualizada correctamente."
            else
              echo ""
              echo "Health check FALLIDO. Cancelando despliegue en produccion."
              docker rm -f mi-app-new || true
              exit 1
            fi

            docker system prune -f

            echo "=== Pipeline finalizado ==="
